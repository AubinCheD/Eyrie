[package]
name = "eyrie"
description = "La suite : les modules dans une seule application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
suite-sdk.workspace = true
suite-carnet.workspace = true
suite-fawkes.workspace = true
suite-dragontree.workspace = true
suite-patronus.workspace = true
suite-owlery.workspace = true
suite-menagerie.workspace = true
suite-grimoire.workspace = true
suite-gringotts.workspace = true
eframe.workspace = true
egui_tiles.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
image.workspace = true
keyring.workspace = true
rfd.workspace = true
menagerie.workspace = true
dragontree-forges.workspace = true
suite-accounts.workspace = true
suite-titlebar.workspace = true
suite-mobile.workspace = true
rmp-serde = "1.3"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"
dragontree-app.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
