[package]
name = "suite-accounts"
description = "Comptes de forge communs à toute la suite EyrieSuite : liste, coffre, normalisation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Eyrie"]

# Sans héritage `workspace = true` : DragonTree et Owlery en dépendent par chemin depuis leurs propres dépôts.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
keyring = "4"

[dev-dependencies]
tempfile = "3"
