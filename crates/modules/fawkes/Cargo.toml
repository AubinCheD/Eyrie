[package]
name = "suite-fawkes"
description = "Fawkes dans la suite : les sources du dépôt voisin compilées en bibliothèque, sans les modifier"
# Même version que Fawkes : son code lit `CARGO_PKG_VERSION` (état enregistré, compagnon Tailscale).
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
suite-sdk.workspace = true
serde_json.workspace = true
# Dépendances de ../Fawkes/Cargo.toml, à garder identiques.
alacritty_terminal = "0.26.0"
arboard = { version = "3.7.0", default-features = false }
dirs = "7.0.0"
eframe.workspace = true
epaint.workspace = true
parking_lot = "0.12.5"
portable-pty = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
